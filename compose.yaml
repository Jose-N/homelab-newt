services:
  newt:
    image: fosrl/newt:1.19
    container_name: newt
    networks:
      - traefik
    environment:
      - PANGOLIN_ENDPOINT=https://pangolin.darkfleetlabs.com
      - NEWT_ID=${NEWT_ID}
      - NEWT_SECRET=${NEWT_SECRET}
    restart: unless-stopped

networks:
  traefik:
    external: true
